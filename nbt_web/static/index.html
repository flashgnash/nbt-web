<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nbt-web</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside id="sidebar">
    <div id="searchwrap">
      <input id="search" type="text" placeholder="fuzzy find servers / worlds / players…" autocomplete="off" spellcheck="false">
    </div>
    <div id="tree"></div>
  </aside>
  <main id="main">
    <div id="topbar">
      <span id="filelabel" class="dim">no file open</span>
      <span id="dirty" class="dirty" hidden>modified</span>
      <span class="spacer"></span>
      <input id="tagsearch" type="text" placeholder="find tag path… (enter = edit)" autocomplete="off" spellcheck="false" hidden>
      <input id="filter" type="text" placeholder="filter keys…" autocomplete="off" spellcheck="false" hidden>
      <button id="save" class="btn primary" disabled title="Save (Ctrl+S)">save</button>
      <button id="reload" class="btn" disabled title="Reload from disk">reload</button>
    </div>
    <div id="tagresults" hidden></div>
    <div id="status" hidden></div>
    <div id="editor">
      <div id="empty" class="dim">Pick a world, player or data file on the left.</div>
    </div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
